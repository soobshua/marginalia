<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marginalia — 500 Foundational Texts Sanctuary</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons UMD -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap');
      body {
        font-family: 'Newsreader', serif;
        background-color: #FDFBF7;
        color: #3E332E;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
</head>
<body class="bg-[#FDFBF7] text-[#3E332E] selection:bg-[#B89388]/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const Icon = ({ name, className = "w-4 h-4", ...props }) => {
          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          }, [name]);
          return <i data-lucide={name} className={className} {...props}></i>;
        };

        function MarginaliaApp() {
          const [activeTab, setActiveTab] = useState('stack');
          const [books, setBooks] = useState([]);
          const [isLoading, setIsLoading] = useState(true);

          // Your Google Sheet CSV Export Link:
          const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/10LcHUiSL2_GG_OyT18wyeFkJo3dzn0wU9o4QMq1Zdbw/export?format=csv";

          const [duelPair, setDuelPair] = useState([]);
          const [friends, setFriends] = useState([
            { id: 'f1', name: 'Eleanor Vance', attunement: '92% Canon Attunement', status: 'Annotating Ancient Epics' },
            { id: 'f2', name: 'Julian Cadogan', attunement: '86% Canon Attunement', status: 'Reviewing 19th c. Prose' }
          ]);
          const [marginNotes, setMarginNotes] = useState([
            { id: 'm1', user: 'Eleanor Vance', book: 'The Iliad', note: 'Book 1: The invocation sets the entire architectural weight of the project.', time: '2 hours ago' }
          ]);
          const [newNoteInput, setNewNoteInput] = useState('');
          const [selectedBookForNote, setSelectedBookForNote] = useState('');

          const [letters, setLetters] = useState([
            {
              id: 'l1',
              sender: 'Julian Cadogan',
              recipient: 'Chloe',
              bookTitle: 'The Iliad',
              message: 'Dearest colleague, I found your notes on the text remarkably perceptive.',
              sealed: false,
              date: 'August 19, 2026'
            }
          ]);
          const [isWritingLetter, setIsWritingLetter] = useState(false);
          const [letterRecipient, setLetterRecipient] = useState('');
          const [letterBook, setLetterBook] = useState('');
          const [letterBody, setLetterBody] = useState('');

          const [groups, setGroups] = useState([
            {
              id: 'g1',
              name: 'The 500 Foundations Guild',
              description: 'Rigorous tracking, translation comparisons, and relative grading across the master foundational corpus.',
              membersCount: 42,
              currentFocus: 'Classical Epics & Continental Philosophy'
            }
          ]);

          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          });

          // Fetch and parse Google Sheet CSV
          useEffect(() => {
            fetch(SHEET_CSV_URL)
              .then(res => res.text())
              .then(csvText => {
                const rows = csvText.split('\n').map(row => row.split(',').map(val => val.replace(/^"|"$/g, '').trim()));
                const headers = rows[0].map(h => h.toLowerCase());
                
                const parsedBooks = rows.slice(1).filter(row => row.length >= headers.length && row[0]).map((row, idx) => {
                  const getCol = (name) => {
                    const i = headers.indexOf(name);
                    return i !== -1 ? row[i] : '';
                  };
                  return {
                    id: `sheet-${idx}`,
                    title: getCol('title') || 'Untitled Text',
                    author: getCol('author') || 'Unknown Author',
                    era: getCol('era') || 'Foundational',
                    country: getCol('country') || 'Global',
                    pages: parseInt(getCol('pages')) || 350,
                    eloRank: parseInt(getCol('elorank')) || 1500,
                    rereadDates: [],
                    description: getCol('description') || 'Foundational text item.'
                  };
                });

                const sorted = parsedBooks.sort((a, b) => b.eloRank - a.eloRank);
                setBooks(sorted);
                if (sorted.length > 0) setSelectedBookForNote(sorted[0].title);
                setIsLoading(false);
              })
              .catch(err => {
                console.error("Error loading sheet:", err);
                setIsLoading(false);
              });
          }, []);

          useEffect(() => {
            if (books.length >= 2 && duelPair.length === 0) {
              setDuelPair([books[0], books[1]]);
            }
          }, [books]);

          const handleDuelChoice = (winner, loser) => {
            const K = 32;
            const expectedWinner = 1 / (1 + Math.pow(10, (loser.eloRank - winner.eloRank) / 400));
            const expectedLoser = 1 / (1 + Math.pow(10, (winner.eloRank - loser.eloRank) / 400));

            const newWinnerRank = Math.round(winner.eloRank + K * (1 - expectedWinner));
            const newLoserRank = Math.round(loser.eloRank + K * (0 - expectedLoser));

            setBooks(prev => prev.map(b => {
              if (b.id === winner.id) return { ...b, eloRank: newWinnerRank };
              if (b.id === loser.id) return { ...b, eloRank: newLoserRank };
              return b;
            }).sort((a, b) => b.eloRank - a.eloRank));

            const shuffled = [...books].sort(() => 0.5 - Math.random());
            if (shuffled.length >= 2) setDuelPair([shuffled[0], shuffled[1]]);
          };

          const handleReread = (id) => {
            const today = new Date().toISOString().split('T')[0];
            setBooks(prev => prev.map(b => {
              if (b.id === id) {
                return { ...b, rereadDates: [...b.rereadDates, today] };
              }
              return b;
            }));
          };

          const exportJournal = () => {
            let content = `# 500 Foundational Texts Sanctuary Journal\n\n`;
            content += `## Master Relative Ranking Stack (${books.length} Texts)\n`;
            books.forEach((b, i) => {
              content += `${i + 1}. **${b.title}** by ${b.author} (Elo: ${b.eloRank}, Era: ${b.era})\n`;
            });

            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'foundational_texts_sanctuary.md';
            link.click();
          };

          const totalPagesRead = books.reduce((acc, b) => acc + b.pages, 0);
          const totalRereads = books.reduce((acc, b) => acc + b.rereadDates.length, 0);

          if (isLoading) {
            return (
              <div className="min-h-screen flex items-center justify-center bg-[#FDFBF7]">
                <p className="font-serif italic text-lg text-[#3E332E]">Loading your 500 Foundational Texts Corpus...</p>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-[#FDFBF7] text-[#3E332E] font-serif flex flex-col">
              <header className="border-b border-[#3E332E]/15 bg-[#F5F2EB]/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <Icon name="feather" className="w-6 h-6 text-[#7A8D7B]" />
                  <h1 className="text-2xl font-semibold tracking-wide text-[#1A110E] font-serif">Marginalia</h1>
                  <span className="text-xs uppercase tracking-widest px-2 py-0.5 border border-[#3E332E]/30 rounded-full text-[#3E332E]/70 hidden sm:inline-block">
                    500 Foundations Edition
                  </span>
                </div>

                <nav className="hidden md:flex items-center gap-1 bg-[#FDFBF7] border border-[#3E332E]/10 p-1 rounded-lg shadow-inner">
                  {[
                    { id: 'stack', label: 'Ranking Stack', icon: 'book-open' },
                    { id: 'duel', label: 'Duels', icon: 'flame' },
                    { id: 'profile', label: 'Analytics', icon: 'compass' },
                    { id: 'social', label: 'The Margins', icon: 'users' },
                    { id: 'mail', label: 'Postal Mail', icon: 'mail' },
                    { id: 'groups', label: 'Guilds', icon: 'award' },
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center gap-2 px-3.5 py-1.5 rounded-md text-sm transition-all ${
                        activeTab === tab.id ? 'bg-[#1A110E] text-[#FDFBF7] shadow-sm' : 'text-[#3E332E]/70 hover:text-[#1A110E] hover:bg-[#F5F2EB]'
                      }`}
                    >
                      <Icon name={tab.icon} className="w-4 h-4" />
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </nav>

                <button
                  onClick={exportJournal}
                  className="text-xs border border-[#3E332E]/30 px-3 py-1.5 rounded hover:bg-[#3E332E] hover:text-[#FDFBF7] transition-all flex items-center gap-1.5 shadow-sm"
                >
                  <Icon name="file-text" className="w-3.5 h-3.5" />
                  <span>Export Journal</span>
                </button>
              </header>

              <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
                {activeTab === 'stack' && (
                  <div className="space-y-6 animate-fadeIn">
                    <div className="flex justify-between items-center border-b border-[#3E332E]/15 pb-4">
                      <div>
                        <h2 className="text-3xl font-serif text-[#1A110E]">Master 500 Hierarchy Stack</h2>
                        <p className="text-sm text-[#3E332E]/70 italic">Relative Elo ranking synchronized directly from your Google Sheet.</p>
                      </div>
                      <span className="font-mono text-xs bg-[#F5F2EB] border border-[#3E332E]/20 px-3 py-1 rounded">
                        {books.length} Texts Synchronized
                      </span>
                    </div>

                    <div className="grid gap-4">
                      {books.map((book, index) => (
                        <div
                          key={book.id}
                          className="bg-[#F5F2EB]/50 border border-[#3E332E]/15 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs"
                        >
                          <div className="flex items-center gap-4">
                            <span className="font-serif text-lg text-[#3E332E]/40 w-6 text-right">#{index + 1}</span>
                            <div>
                              <h3 className="font-serif text-lg text-[#1A110E] font-medium">{book.title}</h3>
                              <p className="text-sm text-[#3E332E]/80">by {book.author}</p>
                              <div className="flex flex-wrap items-center gap-2 mt-1 text-xs text-[#3E332E]/60">
                                <span className="bg-[#FDFBF7] px-2 py-0.5 rounded border border-[#3E332E]/10">{book.era}</span>
                                <span className="bg-[#FDFBF7] px-2 py-0.5 rounded border border-[#3E332E]/10">{book.country}</span>
                                <span>{book.pages} pages</span>
                                {book.rereadDates.length > 0 && (
                                  <span className="text-[#B89388] font-medium flex items-center gap-1">
                                    <Icon name="rotate-ccw" className="w-3 h-3" /> Reread {book.rereadDates.length}x
                                  </span>
                                )}
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-[#3E332E]/10">
                            <div className="text-right">
                              <span className="text-xs uppercase tracking-wider text-[#3E332E]/50 block">Elo Score</span>
                              <span className="font-mono text-sm font-semibold text-[#1A110E]">{book.eloRank}</span>
                            </div>
                            <button
                              onClick={() => handleReread(book.id)}
                              className="border border-[#3E332E]/30 px-3 py-1.5 rounded text-xs hover:bg-[#7A8D7B] hover:text-white transition-all flex items-center gap-1.5"
                            >
                              <Icon name="rotate-ccw" className="w-3 h-3" />
                              <span>Log Reread</span>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'duel' && duelPair.length === 2 && (
                  <div className="max-w-3xl mx-auto space-y-8 animate-fadeIn text-center">
                    <div>
                      <h2 className="text-3xl font-serif text-[#1A110E]">Corpus Duels</h2>
                      <p className="text-sm text-[#3E332E]/70 italic mt-1">Calibrate your relative ranking stack between foundational texts.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 my-8">
                      {duelPair.map((book, idx) => (
                        <div
                          key={book.id}
                          onClick={() => handleDuelChoice(book, duelPair[1 - idx])}
                          className="bg-[#F5F2EB] border-2 border-[#3E332E]/20 hover:border-[#7A8D7B] rounded-xl p-6 cursor-pointer transition-all shadow-md flex flex-col items-center group"
                        >
                          <h3 className="font-serif text-xl text-[#1A110E] font-medium mb-2">{book.title}</h3>
                          <p className="text-sm text-[#3E332E]/70 mb-3">by {book.author}</p>
                          <p className="text-xs text-[#3E332E]/60 italic line-clamp-2 mb-4 bg-[#FDFBF7] p-2 rounded border border-[#3E332E]/10">"{book.description}"</p>
                          <button className="mt-auto bg-[#1A110E] text-[#FDFBF7] px-4 py-2 rounded text-xs tracking-wider uppercase group-hover:bg-[#7A8D7B] transition-colors">
                            Prefer This Text
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'profile' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="border-b border-[#3E332E]/15 pb-4">
                      <h2 className="text-3xl font-serif text-[#1A110E]">Corpus Analytics</h2>
                      <p className="text-sm text-[#3E332E]/70 italic">Restrained strictly to your connected Google Sheet.</p>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-5 rounded-lg text-center">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-1">Total Corpus Size</span>
                        <span className="text-3xl font-serif text-[#1A110E]">{books.length}</span>
                      </div>
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-5 rounded-lg text-center">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-1">Total Pages</span>
                        <span className="text-3xl font-serif text-[#1A110E]">{totalPagesRead.toLocaleString()}</span>
                      </div>
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-5 rounded-lg text-center">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-1">Total Rereads</span>
                        <span className="text-3xl font-serif text-[#1A110E]">{totalRereads}</span>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'social' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="border-b border-[#3E332E]/15 pb-4">
                      <h2 className="text-3xl font-serif text-[#1A110E]">The Margins & Companions</h2>
                      <p className="text-sm text-[#3E332E]/70 italic">Pass notes back and forth on your synced texts.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 rounded-lg p-6 space-y-4">
                        <h3 className="font-serif text-xl text-[#1A110E]">Connected Scholars</h3>
                        <div className="space-y-3">
                          {friends.map(friend => (
                            <div key={friend.id} className="bg-[#FDFBF7] p-4 rounded-md border border-[#3E332E]/10 flex items-center justify-between">
                              <div>
                                <p className="font-medium text-[#1A110E]">{friend.name}</p>
                                <p className="text-xs text-[#7A8D7B] font-semibold mt-0.5">{friend.attunement}</p>
                              </div>
                              <span className="text-xs text-[#3E332E]/60 italic">{friend.status}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 rounded-lg p-6 flex flex-col justify-between">
                        <div>
                          <h3 className="font-serif text-xl text-[#1A110E] mb-4">Corpus Margin Notes</h3>
                          <div className="space-y-3 max-h-52 overflow-y-auto pr-1">
                            {marginNotes.map(m => (
                              <div key={m.id} className="bg-[#FDFBF7] p-3 rounded border border-[#3E332E]/10 text-sm">
                                <div className="flex justify-between items-center text-xs text-[#3E332E]/50 mb-1">
                                  <span className="font-semibold text-[#1A110E]">{m.user}</span>
                                  <span>{m.time}</span>
                                </div>
                                <p className="italic text-[#3E332E]/90">"{m.note}"</p>
                                <span className="text-[10px] text-[#7A8D7B] uppercase mt-1 block">Volume: {m.book}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className="mt-4 space-y-2">
                          <select
                            value={selectedBookForNote}
                            onChange={(e) => setSelectedBookForNote(e.target.value)}
                            className="w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded px-2 py-1 text-xs text-[#1A110E]"
                          >
                            {books.map(b => (
                              <option key={b.id} value={b.title}>{b.title}</option>
                            ))}
                          </select>
                          <div className="flex gap-2">
                            <input
                              type="text"
                              placeholder="Leave a note on this text..."
                              value={newNoteInput}
                              onChange={(e) => setNewNoteInput(e.target.value)}
                              className="flex-1 bg-[#FDFBF7] border border-[#3E332E]/20 rounded px-3 py-1.5 text-sm text-[#1A110E]"
                            />
                            <button
                              onClick={() => {
                                if (!newNoteInput.trim()) return;
                                setMarginNotes(prev => [
                                  { id: Date.now().toString(), user: 'You', book: selectedBookForNote || books[0]?.title, note: newNoteInput, time: 'Just now' },
                                  ...prev
                                ]);
                                setNewNoteInput('');
                              }}
                              className="bg-[#1A110E] text-[#FDFBF7] px-4 py-1.5 rounded text-xs hover:bg-[#7A8D7B]"
                            >
                              Inscribe
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'mail' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="flex justify-between items-center border-b border-[#3E332E]/15 pb-4">
                      <div>
                        <h2 className="text-3xl font-serif text-[#1A110E]">Postal Mail & Letters</h2>
                        <p className="text-sm text-[#3E332E]/70 italic">Dispatch wax-sealed notes on specific foundational volumes.</p>
                      </div>
                      <button
                        onClick={() => setIsWritingLetter(true)}
                        className="bg-[#1A110E] text-[#FDFBF7] px-4 py-2 rounded text-xs tracking-wider uppercase flex items-center gap-2 hover:bg-[#7A8D7B]"
                      >
                        <Icon name="mail" className="w-4 h-4" />
                        <span>Dispatch Letter</span>
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {letters.map((letter) => (
                        <div key={letter.id} className="bg-[#F5F2EB] border border-[#3E332E]/15 rounded-lg p-6 space-y-4 shadow-sm relative overflow-hidden">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="text-[10px] uppercase tracking-widest bg-[#7A8D7B]/20 text-[#3E332E] px-2 py-0.5 rounded">
                                From {letter.sender} to {letter.recipient}
                              </span>
                              <h4 className="font-serif text-xl text-[#1A110E] mt-2">{letter.bookTitle}</h4>
                            </div>
                            <span className="text-xs text-[#3E332E]/50">{letter.date}</span>
                          </div>

                          <div className="bg-[#FDFBF7] p-4 rounded border border-[#3E332E]/10">
                            <p className="font-serif italic text-sm text-[#3E332E]/90 leading-relaxed">"{letter.message}"</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'groups' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="border-b border-[#3E332E]/15 pb-4">
                      <h2 className="text-3xl font-serif text-[#1A110E]">Reading Guilds & Salons</h2>
                      <p className="text-sm text-[#3E332E]/70 italic">Collective focus dedicated entirely to your 500 foundational works.</p>
                    </div>

                    <div className="space-y-6">
                      {groups.map(group => (
                        <div key={group.id} className="bg-[#F5F2EB] border border-[#3E332E]/15 rounded-lg p-6 space-y-6">
                          <div className="flex justify-between items-center">
                            <div>
                              <h3 className="font-serif text-2xl text-[#1A110E]">{group.name}</h3>
                              <p className="text-sm text-[#3E332E]/80 mt-1">{group.description}</p>
                            </div>
                            <span className="font-serif text-lg text-[#1A110E]">{group.membersCount} Scholars</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </main>

              <footer className="border-t border-[#3E332E]/15 bg-[#F5F2EB]/50 py-6 text-center text-xs text-[#3E332E]/60 font-serif">
                <p>Marginalia — Synchronized with your Google Sheets 500 Foundational Texts Corpus.</p>
              </footer>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MarginaliaApp />);
    </script>
</body>
</html>
