<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marginalia — The 500</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons UMD -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap');
      body {
        font-family: 'Newsreader', serif;
        background-color: #FDFBF7;
        color: #3E332E;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
</head>
<body class="bg-[#FDFBF7] text-[#3E332E] selection:bg-[#B89388]/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const Icon = ({ name, className = "w-4 h-4", ...props }) => {
          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          }, [name]);
          return <i data-lucide={name} className={className} {...props}></i>;
        };

        function MarginaliaApp() {
          const [activeTab, setActiveTab] = useState('stack');
          const [books, setBooks] = useState([]);
          const [isLoading, setIsLoading] = useState(true);

          const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/10LcHUiSL2_GG_OyT18wyeFkJo3dzn0wU9o4QMq1Zdbw/export?format=csv";
          const STORAGE_KEY = 'marginalia_corpus_state_v2';

          // Binary insertion duel state
          const [activeDuel, setActiveDuel] = useState(null);
          
          // Dispatch state with autocomplete
          const [dispatchQuery, setDispatchQuery] = useState('');
          const [dispatchSelectedBook, setDispatchSelectedBook] = useState(null);
          const [showDropdown, setShowDropdown] = useState(false);
          const dropdownRef = useRef(null);
          const [dispatchRecipient, setDispatchRecipient] = useState('');
          const [dispatchMessage, setDispatchMessage] = useState('');

          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          });

          useEffect(() => {
            const handleClickOutside = (e) => {
              if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
                setShowDropdown(false);
              }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          // Fetch and parse Google Sheet CSV safely with localStorage persistence synchronization
          useEffect(() => {
            fetch(SHEET_CSV_URL)
              .then(res => res.text())
              .then(csvText => {
                const lines = csvText.split('\n');
                const parseCSVLine = (text) => {
                  const result = [];
                  let current = '';
                  let inQuotes = false;
                  for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (char === '"') {
                      inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                      result.push(current.replace(/^"|"$/g, '').trim());
                      current = '';
                    } else {
                      current += char;
                    }
                  }
                  result.push(current.replace(/^"|"$/g, '').trim());
                  return result;
                };

                const rows = lines.map(line => parseCSVLine(line));
                if (rows.length === 0) {
                  setIsLoading(false);
                  return;
                }

                const rawHeaders = rows[0].map(h => h.toLowerCase().trim());

                const parsedBooks = rows.slice(1).filter(row => row.length > 0 && row.some(cell => cell !== '')).map((row, idx) => {
                  const getColVal = (possibleNames) => {
                    for (let name of possibleNames) {
                      const index = rawHeaders.indexOf(name);
                      if (index !== -1 && row[index] !== undefined && row[index] !== '') {
                        return row[index];
                      }
                    }
                    for (let name of possibleNames) {
                      const index = rawHeaders.findIndex(h => h.includes(name));
                      if (index !== -1 && row[index] !== undefined && row[index] !== '') {
                        return row[index];
                      }
                    }
                    return '';
                  };

                  const title = getColVal(['title', 'work', 'text', 'book']) || row[0] || 'Untitled Text';
                  const author = getColVal(['author', 'writer', 'creator']) || row[1] || 'Unknown Author';
                  const timePeriod = getColVal(['time period', 'time_period', 'era', 'period', 'century', 'date']) || row[2] || 'Global';
                  const country = getColVal(['country', 'region', 'nation', 'origin']) || row[3] || 'Global';
                  const description = getColVal(['description', 'summary', 'notes']) || row[4] || 'Foundational text item.';

                  return {
                    id: `sheet-${idx}`,
                    title,
                    author,
                    timePeriod,
                    country,
                    eloRank: null,
                    readCount: 0,
                    rereadDates: [],
                    isArchived: false,
                    description
                  };
                });

                // Merge with saved localStorage state if available
                const savedState = localStorage.getItem(STORAGE_KEY);
                if (savedState) {
                  try {
                    const savedBooksMap = JSON.parse(savedState);
                    const mergedBooks = parsedBooks.map(book => {
                      if (savedBooksMap[book.id]) {
                        return { ...book, ...savedBooksMap[book.id] };
                      }
                      return book;
                    });
                    setBooks(mergedBooks);
                    if (mergedBooks.length > 0) {
                      setDispatchSelectedBook(mergedBooks[0]);
                      setDispatchQuery(`${mergedBooks[0].title} — ${mergedBooks[0].author}`);
                    }
                  } catch (e) {
                    console.error("Error parsing localStorage state:", e);
                    setBooks(parsedBooks);
                    if (parsedBooks.length > 0) {
                      setDispatchSelectedBook(parsedBooks[0]);
                      setDispatchQuery(`${parsedBooks[0].title} — ${parsedBooks[0].author}`);
                    }
                  }
                } else {
                  setBooks(parsedBooks);
                  if (parsedBooks.length > 0) {
                    setDispatchSelectedBook(parsedBooks[0]);
                    setDispatchQuery(`${parsedBooks[0].title} — ${parsedBooks[0].author}`);
                  }
                }
                setIsLoading(false);
              })
              .catch(err => {
                console.error("Error loading sheet:", err);
                setIsLoading(false);
              });
          }, []);

          // Save state changes to localStorage whenever books state updates
          useEffect(() => {
            if (books.length > 0 && !isLoading) {
              const booksMap = {};
              books.forEach(b => {
                booksMap[b.id] = {
                  eloRank: b.eloRank,
                  readCount: b.readCount,
                  rereadDates: b.rereadDates,
                  isArchived: b.isArchived
                };
              });
              localStorage.setItem(STORAGE_KEY, JSON.stringify(booksMap));
            }
          }, [books, isLoading]);

          const rankedBooks = books.filter(b => b.eloRank !== null && !b.isArchived).sort((a, b) => b.eloRank - a.eloRank);
          const unrankedBooks = books.filter(b => b.eloRank === null && !b.isArchived);
          const archivedBooks = books.filter(b => b.isArchived);

          const startBinaryDuel = (targetBook, currentRanked) => {
            if (currentRanked.length === 0) {
              setBooks(prev => prev.map(b => b.id === targetBook.id ? { ...b, eloRank: 1500, readCount: b.readCount + 1 } : b));
              return;
            }
            setActiveDuel({
              book: targetBook,
              list: currentRanked,
              low: 0,
              high: currentRanked.length - 1,
              mid: Math.floor((0 + currentRanked.length - 1) / 2)
            });
          };

          const handleFirstRead = (id) => {
            const target = books.find(b => b.id === id);
            if (!target) return;

            const currentRanked = books.filter(b => b.eloRank !== null && !b.isArchived).sort((a, b) => b.eloRank - a.eloRank);
            
            setBooks(prev => prev.map(b => b.id === id ? { ...b, readCount: 1 } : b));

            if (currentRanked.length === 0) {
              setBooks(prev => prev.map(b => b.id === id ? { ...b, eloRank: 1500 } : b));
            } else {
              startBinaryDuel(target, currentRanked);
            }
          };

          const handleReread = (id) => {
            const today = new Date().toISOString().split('T')[0];
            const target = books.find(b => b.id === id);
            if (!target) return;

            setBooks(prev => prev.map(b => {
              if (b.id === id) {
                return { ...b, readCount: b.readCount + 1, rereadDates: [...b.rereadDates, today] };
              }
              return b;
            }));

            const currentRanked = books.filter(b => b.eloRank !== null && !b.isArchived && b.id !== id).sort((a, b) => b.eloRank - a.eloRank);
            if (currentRanked.length > 0) {
              startBinaryDuel(target, currentRanked);
            }
          };

          const handleArchive = (id) => {
            setBooks(prev => prev.map(b => b.id === id ? { ...b, isArchived: true } : b));
          };

          const handleUnarchive = (id) => {
            setBooks(prev => prev.map(b => b.id === id ? { ...b, isArchived: false } : b));
          };

          const handleDuelResponse = (preferTarget) => {
            if (!activeDuel) return;
            const { book, list, low, high, mid } = activeDuel;

            let newLow = low;
            let newHigh = high;

            if (preferTarget) {
              newHigh = mid - 1;
            } else {
              newLow = mid + 1;
            }

            if (newLow <= newHigh) {
              const nextMid = Math.floor((newLow + newHigh) / 2);
              setActiveDuel({ ...activeDuel, low: newLow, high: newHigh, mid: nextMid });
            } else {
              const insertIndex = preferTarget ? mid : mid + 1;
              
              setBooks(prev => {
                const updated = prev.map(b => {
                  if (b.id === book.id) {
                    const above = list[insertIndex - 1];
                    const below = list[insertIndex];
                    let newElo = 1500;
                    if (above && below) newElo = Math.round((above.eloRank + below.eloRank) / 2);
                    else if (above) newElo = above.eloRank - 20;
                    else if (below) newElo = below.eloRank + 20;
                    return { ...b, eloRank: newElo };
                  }
                  return b;
                });
                return updated;
              });

              setActiveDuel(null);
            }
          };

          const handleDispatchMail = (e) => {
            e.preventDefault();
            const bookTitle = dispatchSelectedBook ? dispatchSelectedBook.title : dispatchQuery;
            const subject = encodeURIComponent(`A Foundational Text Dispatch: ${bookTitle}`);
            const body = encodeURIComponent(`Hello,\n\nI am sharing a foundational text with you from The 500 corpus:\n\nTitle: ${bookTitle}\n\nNote:\n${dispatchMessage}\n\n— Sent via Marginalia`);
            window.location.href = `mailto:${dispatchRecipient}?subject=${subject}&body=${body}`;
          };

          const getFavoriteMetric = (key) => {
            if (rankedBooks.length === 0) return 'None yet';
            const counts = {};
            rankedBooks.forEach(b => {
              const val = b[key];
              if (val) counts[val] = (counts[val] || 0) + 1;
            });
            let topVal = 'None';
            let maxCount = 0;
            for (const [k, v] of Object.entries(counts)) {
              if (v > maxCount) {
                maxCount = v;
                topVal = k;
              }
            }
            return topVal;
          };

          const calculateWeightedFavoriteDecade = () => {
            if (rankedBooks.length === 0) return 'None yet';
            const topCount = Math.max(1, Math.ceil(rankedBooks.length * 0.10));
            const topBooks = rankedBooks.slice(0, topCount);

            let totalWeightedYear = 0;
            let totalWeight = 0;

            topBooks.forEach((b, index) => {
              const weight = topCount - index;
              const matches = b.timePeriod.match(/\b(1[0-9]{3}|20[0-9]{2}|[0-9]{3,4})\b/g);
              if (matches && matches.length > 0) {
                let year = parseInt(matches[0], 10);
                if (b.timePeriod.toLowerCase().includes('bc') || b.timePeriod.toLowerCase().includes('bce')) {
                  year = -year;
                }
                totalWeightedYear += year * weight;
                totalWeight += weight;
              }
            });

            if (totalWeight === 0) return 'None yet';

            const averageYear = Math.round(totalWeightedYear / totalWeight);
            const decadeBase = Math.floor(Math.abs(averageYear) / 10) * 10;
            const suffix = averageYear < 0 ? 's BCE' : 's';
            return `${decadeBase}${suffix}`;
          };

          const getMostRereadBook = () => {
            const readBooks = books.filter(b => b.readCount > 1);
            if (readBooks.length === 0) return 'None yet';
            readBooks.sort((a, b) => b.readCount - a.readCount);
            return `${readBooks[0].title} (${readBooks[0].readCount} reads)`;
          };

          const favoriteCountry = getFavoriteMetric('country');
          const favoriteTimePeriod = calculateWeightedFavoriteDecade();
          const favoriteAuthor = getFavoriteMetric('author');
          const mostRereadBook = getMostRereadBook();

          const filteredDispatchBooks = books.filter(b => 
            !b.isArchived && (
              b.title.toLowerCase().includes(dispatchQuery.toLowerCase()) || 
              b.author.toLowerCase().includes(dispatchQuery.toLowerCase())
            )
          );

          if (isLoading) {
            return (
              <div className="min-h-screen flex items-center justify-center bg-[#FDFBF7]">
                <p className="font-serif italic text-lg text-[#3E332E]">Loading Marginalia Corpus...</p>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-[#FDFBF7] text-[#3E332E] font-serif flex flex-col">
              <header className="border-b border-[#3E332E]/15 bg-[#F5F2EB]/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <Icon name="feather" className="w-6 h-6 text-[#7A8D7B]" />
                  <h1 className="text-2xl font-semibold tracking-wide text-[#1A110E] font-serif">Marginalia</h1>
                </div>

                <nav className="hidden md:flex items-center gap-1 bg-[#FDFBF7] border border-[#3E332E]/10 p-1 rounded-lg shadow-inner">
                  {[
                    { id: 'stack', label: 'Ranking Stack', icon: 'book-open' },
                    { id: 'progress', label: 'Progress', icon: 'bar-chart-2' },
                    { id: 'profile', label: 'Reader Profile', icon: 'compass' },
                    { id: 'dispatch', label: 'Dispatch Letter', icon: 'send' },
                    { id: 'archive', label: 'Archive', icon: 'archive' },
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center gap-2 px-3.5 py-1.5 rounded-md text-sm transition-all ${
                        activeTab === tab.id ? 'bg-[#1A110E] text-[#FDFBF7] shadow-sm' : 'text-[#3E332E]/70 hover:text-[#1A110E] hover:bg-[#F5F2EB]'
                      }`}
                    >
                      <Icon name={tab.icon} className="w-4 h-4" />
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </nav>

                <button
                  onClick={() => setActiveTab('archive')}
                  className="md:hidden text-xs border border-[#3E332E]/30 px-3 py-1.5 rounded hover:bg-[#3E332E] hover:text-[#FDFBF7] transition-all flex items-center gap-1.5 shadow-sm"
                >
                  <Icon name="archive" className="w-3.5 h-3.5" />
                  <span>Archive</span>
                </button>
              </header>

              <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
                {activeDuel && (
                  <div className="fixed inset-0 bg-[#3E332E]/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
                    <div className="bg-[#FDFBF7] border border-[#3E332E]/20 rounded-xl max-w-xl w-full p-6 sm:p-8 shadow-2xl space-y-6 text-center">
                      <div>
                        <span className="text-xs uppercase tracking-wider text-[#7A8D7B] font-semibold">Corpus Calibration</span>
                        <h3 className="text-2xl font-serif text-[#1A110E] mt-1">Comparing Texts</h3>
                        <p className="text-sm text-[#3E332E]/70 italic mt-1">Where does <strong className="text-[#1A110E] font-medium">"{activeDuel.book.title}"</strong> stand relative to your stack?</p>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 my-4">
                        <div className="bg-[#F5F2EB] border-2 border-[#7A8D7B] rounded-lg p-5 flex flex-col justify-between">
                          <div>
                            <span className="text-[10px] uppercase tracking-wider text-[#7A8D7B] block mb-1">New Log / Reread</span>
                            <h4 className="font-serif text-lg text-[#1A110E] font-medium">{activeDuel.book.title}</h4>
                            <p className="text-xs text-[#3E332E]/70 mt-1">by {activeDuel.book.author}</p>
                            <div className="flex items-center justify-center gap-2 mt-2 text-[11px] text-[#3E332E]/60">
                              <span>{activeDuel.book.country}</span>
                              <span>•</span>
                              <span>{activeDuel.book.timePeriod}</span>
                            </div>
                          </div>
                          <button
                            type="button"
                            onClick={() => handleDuelResponse(true)}
                            className="mt-4 bg-[#1A110E] text-[#FDFBF7] hover:bg-[#7A8D7B] py-2 rounded text-xs uppercase tracking-wider transition-colors cursor-pointer"
                          >
                            Prefer This
                          </button>
                        </div>

                        <div className="bg-[#F5F2EB] border-2 border-[#3E332E]/20 rounded-lg p-5 flex flex-col justify-between">
                          <div>
                            <span className="text-[10px] uppercase tracking-wider text-[#3E332E]/50 block mb-1">Ranked Benchmark</span>
                            <h4 className="font-serif text-lg text-[#1A110E] font-medium">{activeDuel.list[activeDuel.mid].title}</h4>
                            <p className="text-xs text-[#3E332E]/70 mt-1">by {activeDuel.list[activeDuel.mid].author}</p>
                            <div className="flex items-center justify-center gap-2 mt-2 text-[11px] text-[#3E332E]/60">
                              <span>{activeDuel.list[activeDuel.mid].country}</span>
                              <span>•</span>
                              <span>{activeDuel.list[activeDuel.mid].timePeriod}</span>
                            </div>
                          </div>
                          <button
                            type="button"
                            onClick={() => handleDuelResponse(false)}
                            className="mt-4 bg-[#1A110E] text-[#FDFBF7] hover:bg-[#7A8D7B] py-2 rounded text-xs uppercase tracking-wider transition-colors cursor-pointer"
                          >
                            Prefer This
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'stack' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div>
                      <h2 className="text-3xl font-serif text-[#1A110E]">The 500</h2>
                      <p className="text-sm text-[#3E332E]/70 italic mt-1">Master relative ranking stack based on your logged reads.</p>
                    </div>

                    {rankedBooks.length > 0 && (
                      <div className="space-y-4">
                        <h3 className="text-xl font-serif text-[#1A110E] border-b border-[#3E332E]/10 pb-2">Ranked Texts</h3>
                        <div className="grid gap-4">
                          {rankedBooks.map((book, index) => (
                            <div
                              key={book.id}
                              className="bg-[#F5F2EB]/50 border border-[#3E332E]/15 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs"
                            >
                              <div className="flex items-start gap-4">
                                <span className="font-serif text-lg text-[#3E332E]/40 w-6 text-right pt-0.5">#{index + 1}</span>
                                <div>
                                  <h4 className="font-serif text-lg text-[#1A110E] font-medium leading-snug">{book.title}</h4>
                                  <p className="text-sm text-[#3E332E]/80 mt-0.5">by {book.author}</p>
                                  <div className="flex flex-wrap items-center gap-2 mt-2 text-xs text-[#3E332E]/60">
                                    <span className="bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium">{book.country}</span>
                                    <span className="bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium">{book.timePeriod}</span>
                                    {book.readCount > 1 && (
                                      <span className="text-[#B89388] font-medium flex items-center gap-1">
                                        <Icon name="rotate-ccw" className="w-3 h-3" /> Reread {book.readCount - 1}x
                                      </span>
                                    )}
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-[#3E332E]/10">
                                <div className="text-right">
                                  <span className="text-xs uppercase tracking-wider text-[#3E332E]/50 block">Elo Score</span>
                                  <span className="font-mono text-sm font-semibold text-[#1A110E]">{book.eloRank}</span>
                                </div>
                                <button
                                  type="button"
                                  onClick={() => handleReread(book.id)}
                                  className="border border-[#3E332E]/30 px-3 py-1.5 rounded text-xs hover:bg-[#7A8D7B] hover:text-white transition-all flex items-center gap-1.5 cursor-pointer"
                                >
                                  <Icon name="rotate-ccw" className="w-3 h-3" />
                                  <span>Log Reread</span>
                                </button>
                                <button
                                  type="button"
                                  onClick={() => handleArchive(book.id)}
                                  className="border border-red-300/60 text-red-700/80 px-2.5 py-1.5 rounded text-xs hover:bg-red-50 transition-all flex items-center gap-1 cursor-pointer"
                                  title="I don't want to read this"
                                >
                                  <Icon name="archive" className="w-3 h-3" />
                                  <span>Archive</span>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {unrankedBooks.length > 0 && (
                      <div className="space-y-4 pt-4">
                        <h3 className="text-xl font-serif text-[#1A110E] border-b border-[#3E332E]/10 pb-2">Unread / Unranked Corpus ({unrankedBooks.length})</h3>
                        <div className="grid gap-4">
                          {unrankedBooks.map((book) => (
                            <div
                              key={book.id}
                              className="bg-[#F5F2EB]/30 border border-[#3E332E]/10 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"
                            >
                              <div>
                                <h4 className="font-serif text-lg text-[#1A110E] font-medium leading-snug">{book.title}</h4>
                                <p className="text-sm text-[#3E332E]/80 mt-0.5">by {book.author}</p>
                                <div className="flex flex-wrap items-center gap-2 mt-2 text-xs text-[#3E332E]/60">
                                  <span className="bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium">{book.country}</span>
                                  <span className="bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium">{book.timePeriod}</span>
                                </div>
                              </div>

                              <div className="flex items-center gap-2 w-full sm:w-auto justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-[#3E332E]/10">
                                <button
                                  type="button"
                                  onClick={() => handleFirstRead(book.id)}
                                  className="bg-[#1A110E] text-[#FDFBF7] px-4 py-2 rounded text-xs tracking-wider uppercase hover:bg-[#7A8D7B] transition-colors cursor-pointer"
                                >
                                  Log Read
                                </button>
                                <button
                                  type="button"
                                  onClick={() => handleArchive(book.id)}
                                  className="border border-red-300/60 text-red-700/80 px-2.5 py-2 rounded text-xs hover:bg-red-50 transition-all flex items-center gap-1 cursor-pointer"
                                  title="I don't want to read this"
                                >
                                  <Icon name="archive" className="w-3 h-3" />
                                  <span>I don't want to read this</span>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'progress' && (() => {
                  const availableBooksCount = books.filter(b => !b.isArchived).length;
                  const totalReadCount = books.filter(b => b.readCount > 0 && !b.isArchived).length;
                  const percent = availableBooksCount > 0 ? Math.round((totalReadCount / availableBooksCount) * 100) : 0;

                  return (
                    <div className="space-y-8 animate-fadeIn max-w-2xl mx-auto">
                      <div className="border-b border-[#3E332E]/15 pb-4">
                        <h2 className="text-3xl font-serif text-[#1A110E]">Corpus Progress</h2>
                        <p className="text-sm text-[#3E332E]/70 italic">Tracking your journey through the active available library.</p>
                      </div>

                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-8 rounded-xl shadow-sm space-y-6">
                        <div className="flex justify-between items-baseline">
                          <div>
                            <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block">Read / Available</span>
                            <span className="text-3xl font-serif text-[#1A110E] font-medium">{totalReadCount} <span className="text-xl text-[#3E332E]/50">/ {availableBooksCount}</span></span>
                          </div>
                          <div className="text-right">
                            <span className="text-3xl font-serif text-[#7A8D7B] font-semibold">{percent}%</span>
                            <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block">Completion</span>
                          </div>
                        </div>

                        <div className="w-full bg-[#3E332E]/10 h-3 rounded-full overflow-hidden">
                          <div 
                            className="bg-[#7A8D7B] h-full transition-all duration-500 rounded-full"
                            style={{ width: `${percent}%` }}
                          ></div>
                        </div>

                        <div className="grid grid-cols-2 gap-4 pt-4 border-t border-[#3E332E]/10 text-center">
                          <div>
                            <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block">Archived Texts</span>
                            <span className="text-xl font-serif text-[#3E332E]">{archivedBooks.length}</span>
                          </div>
                          <div>
                            <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block">Total Corpus Size</span>
                            <span className="text-xl font-serif text-[#3E332E]">{books.length}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()}

                {activeTab === 'profile' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="border-b border-[#3E332E]/15 pb-4">
                      <h2 className="text-3xl font-serif text-[#1A110E]">Reader Profile</h2>
                      <p className="text-sm text-[#3E332E]/70 italic">Insights derived exclusively from your ranked corpus.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center flex flex-col justify-between">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2">Favorite Country</span>
                        <span className="text-xl font-serif text-[#1A110E]">{favoriteCountry}</span>
                      </div>
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center flex flex-col justify-between">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2">Favorite Time Period (Weighted Top 10%)</span>
                        <span className="text-xl font-serif text-[#1A110E]">{favoriteTimePeriod}</span>
                      </div>
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center flex flex-col justify-between">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2">Favorite Author</span>
                        <span className="text-xl font-serif text-[#1A110E]">{favoriteAuthor}</span>
                      </div>
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center flex flex-col justify-between">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2">Most Reread Book</span>
                        <span className="text-xl font-serif text-[#1A110E]">{mostRereadBook}</span>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'dispatch' && (
                  <div className="max-w-xl mx-auto space-y-8 animate-fadeIn">
                    <div className="border-b border-[#3E332E]/15 pb-4">
                      <h2 className="text-3xl font-serif text-[#1A110E]">Dispatch a Letter</h2>
                      <p className="text-sm text-[#3E332E]/70 italic">Send a book and custom note directly via your email client.</p>
                    </div>

                    <form onSubmit={handleDispatchMail} className="bg-[#F5F2EB] border border-[#3E332E]/15 rounded-lg p-6 space-y-4 shadow-sm">
                      <div className="relative" ref={dropdownRef}>
                        <label className="block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1">Search & Select Book</label>
                        <input
                          type="text"
                          value={dispatchQuery}
                          onChange={(e) => {
                            setDispatchQuery(e.target.value);
                            setShowDropdown(true);
                          }}
                          onFocus={() => setShowDropdown(true)}
                          placeholder="Type title or author..."
                          className="w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]"
                          required
                        />

                        {showDropdown && filteredDispatchBooks.length > 0 && (
                          <div className="absolute z-20 left-0 right-0 mt-1 bg-[#FDFBF7] border border-[#3E332E]/20 rounded-lg shadow-lg max-h-60 overflow-y-auto">
                            {filteredDispatchBooks.map(b => (
                              <div
                                key={b.id}
                                onClick={() => {
                                  setDispatchSelectedBook(b);
                                  setDispatchQuery(`${b.title} — ${b.author}`);
                                  setShowDropdown(false);
                                }}
                                className="p-3 hover:bg-[#F5F2EB] cursor-pointer border-b border-[#3E332E]/5 last:border-b-0 text-left"
                              >
                                <div className="font-medium text-[#1A110E] text-sm">{b.title}</div>
                                <div className="text-xs text-[#3E332E]/70 flex items-center gap-2 mt-0.5">
                                  <span>by {b.author}</span>
                                  <span>•</span>
                                  <span>{b.country}</span>
                                  <span>•</span>
                                  <span>{b.timePeriod}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      <div>
                        <label className="block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1">Recipient Email Address</label>
                        <input
                          type="email"
                          required
                          placeholder="colleague@example.com"
                          value={dispatchRecipient}
                          onChange={(e) => setDispatchRecipient(e.target.value)}
                          className="w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]"
                        />
                      </div>

                      <div>
                        <label className="block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1">Personalized Message / Notes</label>
                        <textarea
                          rows="4"
                          required
                          placeholder="Write your reflections or thoughts on this text..."
                          value={dispatchMessage}
                          onChange={(e) => setDispatchMessage(e.target.value)}
                          className="w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]"
                        ></textarea>
                      </div>

                      <button
                        type="submit"
                        className="w-full bg-[#1A110E] text-[#FDFBF7] py-2.5 rounded text-xs tracking-wider uppercase hover:bg-[#7A8D7B] transition-colors flex items-center justify-center gap-2 cursor-pointer"
                      >
                        <Icon name="send" className="w-4 h-4" />
                        <span>Open Mail Client to Dispatch</span>
                      </button>
                    </form>
                  </div>
                )}

                {activeTab === 'archive' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="border-b border-[#3E332E]/15 pb-4">
                      <h2 className="text-3xl font-serif text-[#1A110E]">Archived Corpus</h2>
                      <p className="text-sm text-[#3E332E]/70 italic">Books you have chosen to set aside from your active reading stack.</p>
                    </div>

                    {archivedBooks.length === 0 ? (
                      <div className="bg-[#F5F2EB]/50 border border-[#3E332E]/15 rounded-lg p-12 text-center text-[#3E332E]/60">
                        <Icon name="archive" className="w-8 h-8 mx-auto mb-2 opacity-50" />
                        <p>No archived books at the moment.</p>
                      </div>
                    ) : (
                      <div className="grid gap-4">
                        {archivedBooks.map((book) => (
                          <div
                            key={book.id}
                            className="bg-[#F5F2EB]/50 border border-[#3E332E]/15 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs"
                          >
                            <div>
                              <h4 className="font-serif text-lg text-[#1A110E] font-medium leading-snug">{book.title}</h4>
                              <p className="text-sm text-[#3E332E]/80 mt-0.5">by {book.author}</p>
                              <div className="flex flex-wrap items-center gap-2 mt-2 text-xs text-[#3E332E]/60">
                                <span className="bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium">{book.country}</span>
                                <span className="bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium">{book.timePeriod}</span>
                              </div>
                            </div>

                            <button
                              type="button"
                              onClick={() => handleUnarchive(book.id)}
                              className="bg-[#1A110E] text-[#FDFBF7] px-4 py-2 rounded text-xs tracking-wider uppercase hover:bg-[#7A8D7B] transition-colors flex items-center gap-1.5 cursor-pointer"
                            >
                              <Icon name="rotate-ccw" className="w-3.5 h-3.5" />
                              <span>I came to my sense and I want to read this</span>
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </main>

              <footer className="border-t border-[#3E332E]/15 bg-[#F5F2EB]/50 py-6 text-center text-xs text-[#3E332E]/60 font-serif">
                <p>Marginalia — Synchronized with your Google Sheets Corpus.</p>
              </footer>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MarginaliaApp />);
    </script>
</body>
</html>
