<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marginalia — The 500</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap');
      body {
        font-family: 'Newsreader', serif;
        background-color: #FDFBF7;
        color: #3E332E;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
</head>
<body class="bg-[#FDFBF7] text-[#3E332E] selection:bg-[#B89388]/30">
    <div id="root"></div>

    <script>
        const { useState, useEffect, useRef } = React;
        const e = React.createElement;

        // Native SVG Icon components to prevent DOM mutation crashes
        function FeatherIcon({ className = "w-4 h-4" }) {
          return e('svg', { className, fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', viewBox: '0 0 24 24' },
            e('path', { d: 'M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z' }, null),
            e('line', { x1: '16', y1: '8', x2: '2', y2: '22' }, null),
            e('line', { x1: '17.5', y1: '15', x2: '9', y2: '15' }, null)
          );
        }

        function BookOpenIcon({ className = "w-4 h-4" }) {
          return e('svg', { className, fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', viewBox: '0 0 24 24' },
            e('path', { d: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z' }, null),
            e('path', { d: 'M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z' }, null)
          );
        }

        function BarChartIcon({ className = "w-4 h-4" }) {
          return e('svg', { className, fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', viewBox: '0 0 24 24' },
            e('line', { x1: '18', y1: '20', x2: '18', y2: '10' }, null),
            e('line', { x1: '12', y1: '20', x2: '12', y2: '4' }, null),
            e('line', { x1: '6', y1: '20', x2: '6', y2: '14' }, null)
          );
        }

        function CompassIcon({ className = "w-4 h-4" }) {
          return e('svg', { className, fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', viewBox: '0 0 24 24' },
            e('circle', { cx: '12', cy: '12', r: '10' }, null),
            e('polygon', { points: '16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76' }, null)
          );
        }

        function SendIcon({ className = "w-4 h-4" }) {
          return e('svg', { className, fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', viewBox: '0 0 24 24' },
            e('line', { x1: '22', y1: '2', x2: '11', y2: '13' }, null),
            e('polygon', { points: '22 2 15 22 11 13 2 9 22 2' }, null)
          );
        }

        function ArchiveIcon({ className = "w-4 h-4" }) {
          return e('svg', { className, fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', viewBox: '0 0 24 24' },
            e('polyline', { points: '21 8 21 21 3 21 3 8' }, null),
            e('rect', { x: '1', y: '3', width: '22', height: '5' }, null),
            e('line', { x1: '10', y1: '12', x2: '14', y2: '12' }, null)
          );
        }

        function RotateCcwIcon({ className = "w-4 h-4" }) {
          return e('svg', { className, fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', viewBox: '0 0 24 24' },
            e('polyline', { points: '1 4 1 10 7 10' }, null),
            e('path', { d: 'M3.51 15a9 9 0 1 0 2.13-9.36L1 10' }, null)
          );
        }

        function getIcon(name, props) {
          switch(name) {
            case 'feather': return e(FeatherIcon, props);
            case 'book-open': return e(BookOpenIcon, props);
            case 'bar-chart-2': return e(BarChartIcon, props);
            case 'compass': return e(CompassIcon, props);
            case 'send': return e(SendIcon, props);
            case 'archive': return e(ArchiveIcon, props);
            case 'rotate-ccw': return e(RotateCcwIcon, props);
            default: return null;
          }
        }

        function MarginaliaApp() {
          const [activeTab, setActiveTab] = useState('stack');
          const [books, setBooks] = useState([]);
          const [isLoading, setIsLoading] = useState(true);

          const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/10LcHUiSL2_GG_OyT18wyeFkJo3dzn0wU9o4QMq1Zdbw/export?format=csv";
          const STORAGE_KEY = 'marginalia_corpus_state_v7';

          const [activeDuel, setActiveDuel] = useState(null);
          const [archiveModalBookId, setArchiveModalBookId] = useState(null);
          
          const [dispatchQuery, setDispatchQuery] = useState('');
          const [dispatchSelectedBook, setDispatchSelectedBook] = useState(null);
          const [showDropdown, setShowDropdown] = useState(false);
          const dropdownRef = useRef(null);
          const [dispatchRecipient, setDispatchRecipient] = useState('');
          const [dispatchMessage, setDispatchMessage] = useState('');

          useEffect(() => {
            const handleClickOutside = (ev) => {
              if (dropdownRef.current && !dropdownRef.current.contains(ev.target)) {
                setShowDropdown(false);
              }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          useEffect(() => {
            fetch(SHEET_CSV_URL)
              .then(res => res.text())
              .then(csvText => {
                setTimeout(() => {
                  const parseCSV = (text) => {
                    const rows = [];
                    let currentRow = [];
                    let currentCell = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < text.length; i++) {
                      const char = text[i];
                      const nextChar = text[i + 1];
                      
                      if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                          currentCell += '"';
                          i++;
                        } else {
                          inQuotes = !inQuotes;
                        }
                      } else if (char === ',' && !inQuotes) {
                        currentRow.push(currentCell.trim());
                        currentCell = '';
                      } else if ((char === '\r' || char === '\n') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') i++;
                        currentRow.push(currentCell.trim());
                        if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
                        currentRow = [];
                        currentCell = '';
                      } else {
                        currentCell += char;
                      }
                    }
                    currentRow.push(currentCell.trim());
                    if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
                    return rows;
                  };

                  const rows = parseCSV(csvText);
                  if (rows.length === 0) {
                    setIsLoading(false);
                    return;
                  }

                  const rawHeaders = rows[0].map(h => h.toLowerCase().trim());

                  const parsedBooks = rows.slice(1).filter((row) => {
                    if (row.length === 0 || !row.some(cell => cell !== '')) return false;
                    const joined = row.join(' ').toLowerCase().trim();
                    if (joined === 'read 2021' || (joined.includes('read 2021') && row.length <= 2 && row[0].toLowerCase().includes('read'))) {
                      return false;
                    }
                    return true;
                  }).map((row, idx) => {
                    const getColVal = (possibleNames) => {
                      for (let name of possibleNames) {
                        const index = rawHeaders.indexOf(name);
                        if (index !== -1 && row[index] !== undefined && row[index] !== '') return row[index];
                      }
                      for (let name of possibleNames) {
                        const index = rawHeaders.findIndex(h => h.includes(name));
                        if (index !== -1 && row[index] !== undefined && row[index] !== '') return row[index];
                      }
                      return '';
                    };

                    const title = getColVal(['title', 'work', 'text', 'book']) || row[0] || 'Untitled Text';
                    const author = getColVal(['author', 'writer', 'creator']) || row[1] || 'Unknown Author';
                    const timePeriod = getColVal(['time period', 'time_period', 'era', 'period', 'century', 'date']) || row[2] || 'Global';
                    const country = getColVal(['country', 'region', 'nation', 'origin']) || row[3] || 'Global';
                    const description = getColVal(['description', 'summary', 'notes']) || row[4] || 'Foundational text item.';

                    return {
                      id: `sheet-${idx}`,
                      title,
                      author,
                      timePeriod,
                      country,
                      eloRank: null,
                      readCount: 0,
                      rereadDates: [],
                      isArchived: false,
                      archiveMode: null,
                      description
                    };
                  });

                  const savedState = localStorage.getItem(STORAGE_KEY);
                  if (savedState) {
                    try {
                      const savedBooksMap = JSON.parse(savedState);
                      const mergedBooks = parsedBooks.map(book => {
                        if (savedBooksMap[book.id]) {
                          return Object.assign({}, book, savedBooksMap[book.id]);
                        }
                        return book;
                      });
                      setBooks(mergedBooks);
                      if (mergedBooks.length > 0) {
                        setDispatchSelectedBook(mergedBooks[0]);
                        setDispatchQuery(mergedBooks[0].title + ' — ' + mergedBooks[0].author);
                      }
                    } catch (e) {
                      setBooks(parsedBooks);
                      if (parsedBooks.length > 0) {
                        setDispatchSelectedBook(parsedBooks[0]);
                        setDispatchQuery(parsedBooks[0].title + ' — ' + parsedBooks[0].author);
                      }
                    }
                  } else {
                    setBooks(parsedBooks);
                    if (parsedBooks.length > 0) {
                      setDispatchSelectedBook(parsedBooks[0]);
                      setDispatchQuery(parsedBooks[0].title + ' — ' + parsedBooks[0].author);
                    }
                  }
                  setIsLoading(false);
                }, 0);
              })
              .catch(err => {
                setIsLoading(false);
              });
          }, []);

          useEffect(() => {
            if (books.length > 0 && !isLoading) {
              const booksMap = {};
              books.forEach(b => {
                booksMap[b.id] = {
                  eloRank: b.eloRank,
                  readCount: b.readCount,
                  rereadDates: b.rereadDates,
                  isArchived: b.isArchived,
                  archiveMode: b.archiveMode
                };
              });
              localStorage.setItem(STORAGE_KEY, JSON.stringify(booksMap));
            }
          }, [books, isLoading]);

          const rankedBooks = books.filter(b => b.eloRank !== null && !b.isArchived).sort((a, b) => b.eloRank - a.eloRank);
          const unrankedBooks = books.filter(b => b.eloRank === null && !b.isArchived);
          const archivedBooks = books.filter(b => b.isArchived);

          const startBinaryDuel = (targetBook, currentRanked) => {
            if (currentRanked.length === 0) {
              setBooks(prev => prev.map(b => b.id === targetBook.id ? Object.assign({}, b, { eloRank: 1500, readCount: b.readCount + 1 }) : b));
              return;
            }
            setActiveDuel({
              book: targetBook,
              list: currentRanked,
              low: 0,
              high: currentRanked.length - 1,
              mid: Math.floor((0 + currentRanked.length - 1) / 2)
            });
          };

          const handleFirstRead = (id) => {
            const target = books.find(b => b.id === id);
            if (!target) return;
            const currentRanked = books.filter(b => b.eloRank !== null && !b.isArchived).sort((a, b) => b.eloRank - a.eloRank);
            setBooks(prev => prev.map(b => b.id === id ? Object.assign({}, b, { readCount: 1 }) : b));

            if (currentRanked.length === 0) {
              setBooks(prev => prev.map(b => b.id === id ? Object.assign({}, b, { eloRank: 1500 }) : b));
            } else {
              startBinaryDuel(target, currentRanked);
            }
          };

          const handleReread = (id) => {
            const today = new Date().toISOString().split('T')[0];
            const target = books.find(b => b.id === id);
            if (!target) return;

            setBooks(prev => prev.map(b => {
              if (b.id === id) {
                return Object.assign({}, b, { readCount: b.readCount + 1, rereadDates: b.rereadDates.concat([today]) });
              }
              return b;
            }));

            const currentRanked = books.filter(b => b.eloRank !== null && !b.isArchived && b.id !== id).sort((a, b) => b.eloRank - a.eloRank);
            if (currentRanked.length > 0) {
              startBinaryDuel(target, currentRanked);
            }
          };

          const handleArchiveChoice = (mode) => {
            if (!archiveModalBookId) return;
            setBooks(prev => prev.map(b => {
              if (b.id === archiveModalBookId) {
                if (mode === 'clear') {
                  return Object.assign({}, b, { isArchived: true, archiveMode: 'clear', eloRank: null, readCount: 0, rereadDates: [] });
                } else {
                  return Object.assign({}, b, { isArchived: true, archiveMode: 'keep' });
                }
              }
              return b;
            }));
            setArchiveModalBookId(null);
          };

          const handleUnarchive = (id) => {
            const target = books.find(b => b.id === id);
            if (!target) return;

            if (target.archiveMode === 'keep' && target.eloRank !== null) {
              setBooks(prev => prev.map(b => b.id === id ? Object.assign({}, b, { isArchived: false, archiveMode: null, eloRank: null }) : b));
              const currentRanked = books.filter(b => b.eloRank !== null && !b.isArchived && b.id !== id).sort((a, b) => b.eloRank - a.eloRank);
              startBinaryDuel(target, currentRanked);
            } else {
              setBooks(prev => prev.map(b => b.id === id ? Object.assign({}, b, { isArchived: false, archiveMode: null }) : b));
            }
          };

          const handleDuelResponse = (preferTarget) => {
            if (!activeDuel) return;
            const { book, list, low, high, mid } = activeDuel;
            let newLow = low;
            let newHigh = high;

            if (preferTarget) newHigh = mid - 1;
            else newLow = mid + 1;

            if (newLow <= newHigh) {
              const nextMid = Math.floor((newLow + newHigh) / 2);
              setActiveDuel(Object.assign({}, activeDuel, { low: newLow, high: newHigh, mid: nextMid }));
            } else {
              const insertIndex = preferTarget ? mid : mid + 1;
              setBooks(prev => prev.map(b => {
                if (b.id === book.id) {
                  const above = list[insertIndex - 1];
                  const below = list[insertIndex];
                  let newElo = 1500;
                  if (above && below) newElo = Math.round((above.eloRank + below.eloRank) / 2);
                  else if (above) newElo = above.eloRank - 20;
                  else if (below) newElo = below.eloRank + 20;
                  return Object.assign({}, b, { eloRank: newElo });
                }
                return b;
              }));
              setActiveDuel(null);
            }
          };

          const handleDispatchMail = (ev) => {
            ev.preventDefault();
            const bookTitle = dispatchSelectedBook ? dispatchSelectedBook.title : dispatchQuery;
            const subject = encodeURIComponent('A Foundational Text Dispatch: ' + bookTitle);
            const body = encodeURIComponent('Hello,\n\nI am sharing a foundational text with you from The 500 corpus:\n\nTitle: ' + bookTitle + '\n\nNote:\n' + dispatchMessage + '\n\n— Sent via Marginalia');
            window.location.href = 'mailto:' + dispatchRecipient + '?subject=' + subject + '&body=' + body;
          };

          const getFavoriteMetric = (key) => {
            if (rankedBooks.length === 0) return 'None yet';
            const counts = {};
            rankedBooks.forEach(b => {
              const val = b[key];
              if (val) counts[val] = (counts[val] || 0) + 1;
            });
            let topVal = 'None';
            let maxCount = 0;
            for (const [k, v] of Object.entries(counts)) {
              if (v > maxCount) { maxCount = v; topVal = k; }
            }
            return topVal;
          };

          const calculateWeightedFavoriteDecade = () => {
            if (rankedBooks.length === 0) return 'None yet';
            const topCount = Math.max(1, Math.ceil(rankedBooks.length * 0.10));
            const topBooks = rankedBooks.slice(0, topCount);
            let totalWeightedYear = 0;
            let totalWeight = 0;

            topBooks.forEach((b, index) => {
              const weight = topCount - index;
              const matches = b.timePeriod.match(/\b(1[0-9]{3}|20[0-9]{2}|[0-9]{3,4})\b/g);
              if (matches && matches.length > 0) {
                let year = parseInt(matches[0], 10);
                if (b.timePeriod.toLowerCase().includes('bc') || b.timePeriod.toLowerCase().includes('bce')) {
                  year = -year;
                }
                totalWeightedYear += year * weight;
                totalWeight += weight;
              }
            });

            if (totalWeight === 0) return 'None yet';
            const averageYear = Math.round(totalWeightedYear / totalWeight);
            const decadeBase = Math.floor(Math.abs(averageYear) / 10) * 10;
            const suffix = averageYear < 0 ? 's BCE' : 's';
            return decadeBase + suffix;
          };

          const getMostRereadBook = () => {
            const readBooks = books.filter(b => b.readCount > 1);
            if (readBooks.length === 0) return 'None yet';
            readBooks.sort((a, b) => b.readCount - a.readCount);
            return readBooks[0].title + ' (' + readBooks[0].readCount + ' reads)';
          };

          const favouriteCountry = getFavoriteMetric('country');
          const favouriteTimePeriod = calculateWeightedFavoriteDecade();
          const favouriteAuthor = getFavoriteMetric('author');
          const mostRereadBook = getMostRereadBook();

          const filteredDispatchBooks = books.filter(b => 
            !b.isArchived && (
              b.title.toLowerCase().includes(dispatchQuery.toLowerCase()) || 
              b.author.toLowerCase().includes(dispatchQuery.toLowerCase())
            )
          );

          if (isLoading) {
            return e('div', { className: "min-h-screen flex items-center justify-center bg-[#FDFBF7]" },
              e('p', { className: "font-serif italic text-lg text-[#3E332E]" }, "Loading Marginalia Corpus...")
            );
          }

          return e('div', { className: "min-h-screen bg-[#FDFBF7] text-[#3E332E] font-serif flex flex-col" },
            // Header
            e('header', { className: "border-b border-[#3E332E]/15 bg-[#F5F2EB]/85 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between" },
              e('div', { className: "flex items-center gap-3" },
                getIcon('feather', { className: "w-6 h-6 text-[#7A8D7B]" }),
                e('h1', { className: "text-2xl font-semibold tracking-wide text-[#1A110E] font-serif" }, "Marginalia")
              ),
              e('nav', { className: "hidden md:flex items-center gap-1 bg-[#FDFBF7] border border-[#3E332E]/10 p-1 rounded-lg shadow-inner" },
                [
                  { id: 'stack', label: 'Ranking Stack', icon: 'book-open' },
                  { id: 'progress', label: 'Progress', icon: 'bar-chart-2' },
                  { id: 'profile', label: 'Reader Profile', icon: 'compass' },
                  { id: 'dispatch', label: 'Dispatch Letter', icon: 'send' },
                  { id: 'archive', label: 'Archive', icon: 'archive' },
                ].map(tab => 
                  e('button', {
                    key: tab.id,
                    onClick: () => setActiveTab(tab.id),
                    className: "flex items-center gap-2 px-3.5 py-1.5 rounded-md text-sm transition-all cursor-pointer " + (activeTab === tab.id ? 'bg-[#1A110E] text-[#FDFBF7] shadow-sm' : 'text-[#3E332E]/75 hover:text-[#1A110E] hover:bg-[#F5F2EB]')
                  },
                    getIcon(tab.icon),
                    e('span', null, tab.label)
                  )
                )
              ),
              e('button', {
                onClick: () => setActiveTab('archive'),
                className: "md:hidden text-xs border border-[#3E332E]/30 px-3 py-1.5 rounded hover:bg-[#3E332E] hover:text-[#FDFBF7] transition-all flex items-center gap-1.5 shadow-sm cursor-pointer"
              },
                getIcon('archive', { className: "w-3.5 h-3.5" }),
                e('span', null, "Archive")
              )
            ),

            // Main Content Area
            e('main', { className: "flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8" },
              
              // Archive Modal
              archiveModalBookId && e('div', { className: "fixed inset-0 bg-[#3E332E]/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn" },
                e('div', { className: "bg-[#FDFBF7] border border-[#3E332E]/20 rounded-xl max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-6 text-center" },
                  e('div', null,
                    e('span', { className: "text-xs uppercase tracking-wider text-[#7A8D7B] font-semibold" }, "Archive Options"),
                    e('h3', { className: "text-2xl font-serif text-[#1A110E] mt-1" }, "Handling Statistics"),
                    e('p', { className: "text-sm text-[#3E332E]/70 italic mt-1" }, "How would you like to handle your reading stats for this text?")
                  ),
                  e('div', { className: "grid grid-cols-1 gap-3 pt-2" },
                    e('button', {
                      onClick: () => handleArchiveChoice('clear'),
                      className: "w-full bg-[#F5F2EB] border border-[#3E332E]/20 hover:border-[#3E332E] p-4 rounded-lg text-left transition-all cursor-pointer group"
                    },
                      e('div', { className: "font-serif font-medium text-[#1A110E] group-hover:text-[#7A8D7B]" }, "Clear Stats"),
                      e('div', { className: "text-xs text-[#3E332E]/70 mt-0.5" }, "Resets rank and read counts, sending it back to unread status.")
                    ),
                    e('button', {
                      onClick: () => handleArchiveChoice('keep'),
                      className: "w-full bg-[#F5F2EB] border border-[#3E332E]/20 hover:border-[#3E332E] p-4 rounded-lg text-left transition-all cursor-pointer group"
                    },
                      e('div', { className: "font-serif font-medium text-[#1A110E] group-hover:text-[#7A8D7B]" }, "Keep Stats"),
                      e('div', { className: "text-xs text-[#3E332E]/70 mt-0.5" }, "Preserves your stats and triggers a reranking duel upon unarchiving.")
                    )
                  ),
                  e('button', {
                    onClick: () => setArchiveModalBookId(null),
                    className: "text-xs text-[#3E332E]/50 hover:text-[#3E332E] uppercase tracking-wider cursor-pointer pt-2"
                  }, "Cancel")
                )
              ),

              // Duel Modal
              activeDuel && e('div', { className: "fixed inset-0 bg-[#3E332E]/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn" },
                e('div', { className: "bg-[#FDFBF7] border border-[#3E332E]/20 rounded-xl max-w-xl w-full p-6 sm:p-8 shadow-2xl space-y-6 text-center" },
                  e('div', null,
                    e('span', { className: "text-xs uppercase tracking-wider text-[#7A8D7B] font-semibold" }, "Corpus Calibration"),
                    e('h3', { className: "text-2xl font-serif text-[#1A110E] mt-1" }, "Comparing Texts"),
                    e('p', { className: "text-sm text-[#3E332E]/70 italic mt-1" },
                      "Where does ",
                      e('strong', { className: "text-[#1A110E] font-medium" }, '"' + activeDuel.book.title + '"'),
                      " stand relative to your stack?"
                    )
                  ),
                  e('div', { className: "grid grid-cols-1 sm:grid-cols-2 gap-4 my-4" },
                    e('div', { className: "bg-[#F5F2EB] border-2 border-[#7A8D7B] rounded-lg p-5 flex flex-col justify-between" },
                      e('div', null,
                        e('span', { className: "text-[10px] uppercase tracking-wider text-[#7A8D7B] block mb-1" }, "New Log / Reread"),
                        e('h4', { className: "font-serif text-lg text-[#1A110E] font-medium" }, activeDuel.book.title),
                        e('p', { className: "text-xs text-[#3E332E]/70 mt-1" }, "by " + activeDuel.book.author),
                        e('div', { className: "flex items-center justify-center gap-2 mt-2 text-[11px] text-[#3E332E]/60" },
                          e('span', null, activeDuel.book.country),
                          e('span', null, "•"),
                          e('span', null, activeDuel.book.timePeriod)
                        )
                      ),
                      e('button', {
                        onClick: () => handleDuelResponse(true),
                        className: "mt-4 bg-[#1A110E] text-[#FDFBF7] hover:bg-[#7A8D7B] py-2 rounded text-xs uppercase tracking-wider transition-colors cursor-pointer"
                      }, "Prefer This")
                    ),
                    e('div', { className: "bg-[#F5F2EB] border-2 border-[#3E332E]/20 rounded-lg p-5 flex flex-col justify-between" },
                      e('div', null,
                        e('span', { className: "text-[10px] uppercase tracking-wider text-[#3E332E]/50 block mb-1" }, "Ranked Benchmark"),
                        e('h4', { className: "font-serif text-lg text-[#1A110E] font-medium" }, activeDuel.list[activeDuel.mid].title),
                        e('p', { className: "text-xs text-[#3E332E]/70 mt-1" }, "by " + activeDuel.list[activeDuel.mid].author),
                        e('div', { className: "flex items-center justify-center gap-2 mt-2 text-[11px] text-[#3E332E]/60" },
                          e('span', null, activeDuel.list[activeDuel.mid].country),
                          e('span', null, "•"),
                          e('span', null, activeDuel.list[activeDuel.mid].timePeriod)
                        )
                      ),
                      e('button', {
                        onClick: () => handleDuelResponse(false),
                        className: "mt-4 bg-[#1A110E] text-[#FDFBF7] hover:bg-[#7A8D7B] py-2 rounded text-xs uppercase tracking-wider transition-colors cursor-pointer"
                      }, "Prefer This")
                    )
                  )
                )
              ),

              // Tab 1: Stack
              activeTab === 'stack' && e('div', { className: "space-y-8 animate-fadeIn" },
                e('h2', { className: "text-3xl font-serif text-[#1A110E]" }, "The 500"),
                rankedBooks.length > 0 && e('div', { className: "space-y-4" },
                  e('h3', { className: "text-xl font-serif text-[#1A110E] border-b border-[#3E332E]/10 pb-2" }, "Ranked Texts"),
                  e('div', { className: "grid gap-4" },
                    rankedBooks.map((book, index) => 
                      e('div', {
                        key: book.id,
                        className: "bg-[#F5F2EB]/50 border border-[#3E332E]/15 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs"
                      },
                        e('div', { className: "flex items-start gap-4" },
                          e('span', { className: "font-serif text-lg text-[#3E332E]/40 w-6 text-right pt-0.5" }, "#" + (index + 1)),
                          e('div', null,
                            e('h4', { className: "font-serif text-lg text-[#1A110E] font-medium leading-snug" }, book.title),
                            e('p', { className: "text-sm text-[#3E332E]/80 mt-0.5" }, "by " + book.author),
                            e('div', { className: "flex flex-wrap items-center gap-2 mt-2 text-xs text-[#3E332E]/60" },
                              e('span', { className: "bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium" }, book.country),
                              e('span', { className: "bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium" }, book.timePeriod),
                              book.readCount > 1 && e('span', { className: "text-[#B89388] font-medium flex items-center gap-1" },
                                getIcon('rotate-ccw', { className: "w-3 h-3" }),
                                " Reread " + (book.readCount - 1) + "x"
                              )
                            )
                          )
                        ),
                        e('div', { className: "flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-[#3E332E]/10" },
                          e('div', { className: "text-right" },
                            e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/50 block" }, "Elo Score"),
                            e('span', { className: "font-mono text-sm font-semibold text-[#1A110E]" }, book.eloRank)
                          ),
                          e('button', {
                            onClick: () => handleReread(book.id),
                            className: "border border-[#3E332E]/30 px-3 py-1.5 rounded text-xs hover:bg-[#7A8D7B] hover:text-white transition-all flex items-center gap-1.5 cursor-pointer"
                          },
                            getIcon('rotate-ccw', { className: "w-3 h-3" }),
                            e('span', null, "Log Reread")
                          ),
                          e('button', {
                            onClick: () => setArchiveModalBookId(book.id),
                            className: "border border-red-300/60 text-red-700/80 px-2.5 py-1.5 rounded text-xs hover:bg-red-50 transition-all flex items-center gap-1 cursor-pointer"
                          },
                            getIcon('archive', { className: "w-3 h-3" }),
                            e('span', null, "Archive")
                          )
                        )
                      )
                    )
                  )
                ),
                unrankedBooks.length > 0 && e('div', { className: "space-y-4 pt-4" },
                  e('h3', { className: "text-xl font-serif text-[#1A110E] border-b border-[#3E332E]/10 pb-2" },
                    "Unread / Unranked Corpus (" + unrankedBooks.length + ")"
                  ),
                  e('div', { className: "grid gap-4" },
                    unrankedBooks.map((book) => 
                      e('div', {
                        key: book.id,
                        className: "bg-[#F5F2EB]/30 border border-[#3E332E]/10 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"
                      },
                        e('div', null,
                          e('h4', { className: "font-serif text-lg text-[#1A110E] font-medium leading-snug" }, book.title),
                          e('p', { className: "text-sm text-[#3E332E]/80 mt-0.5" }, "by " + book.author),
                          e('div', { className: "flex flex-wrap items-center gap-2 mt-2 text-xs text-[#3E332E]/60" },
                            e('span', { className: "bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium" }, book.country),
                            e('span', { className: "bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium" }, book.timePeriod)
                          )
                        ),
                        e('div', { className: "flex items-center gap-2 w-full sm:w-auto justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-[#3E332E]/10" },
                          e('button', {
                            onClick: () => handleFirstRead(book.id),
                            className: "bg-[#1A110E] text-[#FDFBF7] px-4 py-2 rounded text-xs tracking-wider uppercase hover:bg-[#7A8D7B] transition-colors cursor-pointer"
                          }, "Log Read"),
                          e('button', {
                            onClick: () => setArchiveModalBookId(book.id),
                            className: "border border-red-300/60 text-red-700/80 px-2.5 py-2 rounded text-xs hover:bg-red-50 transition-all flex items-center gap-1 cursor-pointer"
                          },
                            getIcon('archive', { className: "w-3 h-3" }),
                            e('span', null, "I don't want to read this")
                          )
                        )
                      )
                    )
                  )
                )
              ),

              // Tab 2: Progress
              activeTab === 'progress' && (() => {
                const availableBooksCount = books.filter(b => !b.isArchived).length;
                const totalReadCount = books.filter(b => b.readCount > 0 && !b.isArchived).length;
                const percent = availableBooksCount > 0 ? Math.round((totalReadCount / availableBooksCount) * 100) : 0;

                return e('div', { className: "space-y-8 animate-fadeIn max-w-2xl mx-auto" },
                  e('div', { className: "border-b border-[#3E332E]/15 pb-4" },
                    e('h2', { className: "text-3xl font-serif text-[#1A110E]" }, "Corpus Progress"),
                    e('p', { className: "text-sm text-[#3E332E]/70 italic" }, "Tracking your journey through the active available library.")
                  ),
                  e('div', { className: "bg-[#F5F2EB] border border-[#3E332E]/15 p-8 rounded-xl shadow-sm space-y-6" },
                    e('div', { className: "flex justify-between items-baseline" },
                      e('div', null,
                        e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/60 block" }, "Read / Available"),
                        e('span', { className: "text-3xl font-serif text-[#1A110E] font-medium" },
                          totalReadCount,
                          e('span', { className: "text-xl text-[#3E332E]/50" }, " / " + availableBooksCount)
                        )
                      ),
                      e('div', { className: "text-right" },
                        e('span', { className: "text-3xl font-serif text-[#7A8D7B] font-semibold" }, percent + "%"),
                        e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/60 block" }, "Completion")
                      )
                    ),
                    e('div', { className: "w-full bg-[#3E332E]/10 h-3 rounded-full overflow-hidden" },
                      e('div', { className: "bg-[#7A8D7B] h-full transition-all duration-500 rounded-full", style: { width: percent + '%' } })
                    ),
                    e('div', { className: "grid grid-cols-2 gap-4 pt-4 border-t border-[#3E332E]/10 text-center" },
                      e('div', null,
                        e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/60 block" }, "Archived Texts"),
                        e('span', { className: "text-xl font-serif text-[#3E332E]" }, archivedBooks.length)
                      ),
                      e('div', null,
                        e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/60 block" }, "Total Corpus Size"),
                        e('span', { className: "text-xl font-serif text-[#3E332E]" }, books.length)
                      )
                    )
                  )
                );
              })(),

              // Tab 3: Profile
              activeTab === 'profile' && e('div', { className: "space-y-8 animate-fadeIn" },
                e('div', { className: "border-b border-[#3E332E]/15 pb-4" },
                  e('h2', { className: "text-3xl font-serif text-[#1A110E]" }, "Reader Profile"),
                  e('p', { className: "text-sm text-[#3E332E]/70 italic" }, "Insights derived exclusively from your ranked corpus.")
                ),
                e('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" },
                  e('div', { className: "bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center flex flex-col justify-between" },
                    e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2" }, "Favourite Country"),
                    e('span', { className: "text-xl font-serif text-[#1A110E]" }, favouriteCountry)
                  ),
                  e('div', { className: "bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center flex flex-col justify-between" },
                    e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2" }, "Favourite Time Period (Weighted Top 10%)"),
                    e('span', { className: "text-xl font-serif text-[#1A110E]" }, favouriteTimePeriod)
                  ),
                  e('div', { className: "bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center flex flex-col justify-between" },
                    e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2" }, "Favourite Author"),
                    e('span', { className: "text-xl font-serif text-[#1A110E]" }, favouriteAuthor)
                  ),
                  e('div', { className: "bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center flex flex-col justify-between" },
                    e('span', { className: "text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2" }, "Most Reread Book"),
                    e('span', { className: "text-xl font-serif text-[#1A110E]" }, mostRereadBook)
                  )
                )
              ),

              // Tab 4: Dispatch
              activeTab === 'dispatch' && e('div', { className: "max-w-xl mx-auto space-y-8 animate-fadeIn" },
                e('div', { className: "border-b border-[#3E332E]/15 pb-4" },
                  e('h2', { className: "text-3xl font-serif text-[#1A110E]" }, "Dispatch a Letter"),
                  e('p', { className: "text-sm text-[#3E332E]/70 italic" }, "Send a book and custom note directly via your email client.")
                ),
                e('form', { onSubmit: handleDispatchMail, className: "bg-[#F5F2EB] border border-[#3E332E]/15 rounded-lg p-6 space-y-4 shadow-sm" },
                  e('div', { className: "relative", ref: dropdownRef },
                    e('label', { className: "block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1" }, "Search & Select Book"),
                    e('input', {
                      type: "text",
                      value: dispatchQuery,
                      onChange: (ev) => { setDispatchQuery(ev.target.value); setShowDropdown(true); },
                      onFocus: () => setShowDropdown(true),
                      placeholder: "Type title or author...",
                      className: "w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]",
                      required: true
                    }),
                    showDropdown && filteredDispatchBooks.length > 0 && e('div', { className: "absolute z-20 left-0 right-0 mt-1 bg-[#FDFBF7] border border-[#3E332E]/20 rounded-lg shadow-lg max-h-60 overflow-y-auto" },
                      filteredDispatchBooks.map(b => 
                        e('div', {
                          key: b.id,
                          onClick: () => { setDispatchSelectedBook(b); setDispatchQuery(b.title + ' — ' + b.author); setShowDropdown(false); },
                          className: "p-3 hover:bg-[#F5F2EB] cursor-pointer border-b border-[#3E332E]/5 last:border-b-0 text-left"
                        },
                          e('div', { className: "font-medium text-[#1A110E] text-sm" }, b.title),
                          e('div', { className: "text-xs text-[#3E332E]/70 flex items-center gap-2 mt-0.5" },
                            e('span', null, 'by ' + b.author),
                            e('span', null, "•"),
                            e('span', null, b.country),
                            e('span', null, "•"),
                            e('span', null, b.timePeriod)
                          )
                        )
                      )
                    )
                  ),
                  e('div', null,
                    e('label', { className: "block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1" }, "Recipient Email Address"),
                    e('input', {
                      type: "email",
                      required: true,
                      placeholder: "colleague@example.com",
                      value: dispatchRecipient,
                      onChange: (ev) => setDispatchRecipient(ev.target.value),
                      className: "w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]"
                    })
                  ),
                  e('div', null,
                    e('label', { className: "block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1" }, "Personalised Message / Notes"),
                    e('textarea', {
                      rows: "4",
                      required: true,
                      placeholder: "Write your reflections or thoughts on this text...",
                      value: dispatchMessage,
                      onChange: (ev) => setDispatchMessage(ev.target.value),
                      className: "w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]"
                    })
                  ),
                  e('button', {
                    type: "submit",
                    className: "w-full bg-[#1A110E] text-[#FDFBF7] py-2.5 rounded text-xs tracking-wider uppercase hover:bg-[#7A8D7B] transition-colors flex items-center justify-center gap-2 cursor-pointer"
                  },
                    getIcon('send', { className: "w-4 h-4" }),
                    e('span', null, "Open Mail Client to Dispatch")
                  )
                )
              ),

              // Tab 5: Archive
              activeTab === 'archive' && e('div', { className: "space-y-8 animate-fadeIn" },
                e('div', { className: "border-b border-[#3E332E]/15 pb-4" },
                  e('h2', { className: "text-3xl font-serif text-[#1A110E]" }, "Archived Corpus"),
                  e('p', { className: "text-sm text-[#3E332E]/70 italic" }, "Books you have chosen to set aside from your active reading stack.")
                ),
                archivedBooks.length === 0 ? e('div', { className: "bg-[#F5F2EB]/50 border border-[#3E332E]/15 rounded-lg p-12 text-center text-[#3E332E]/60" },
                  getIcon('archive', { className: "w-8 h-8 mx-auto mb-2 opacity-50" }),
                  e('p', null, "No archived books at the moment.")
                ) : e('div', { className: "grid gap-4" },
                  archivedBooks.map(book => 
                    e('div', {
                      key: book.id,
                      className: "bg-[#F5F2EB]/50 border border-[#3E332E]/15 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs"
                    },
                      e('div', null,
                        e('h4', { className: "font-serif text-lg text-[#1A110E] font-medium leading-snug" }, book.title),
                        e('p', { className: "text-sm text-[#3E332E]/80 mt-0.5" }, "by " + book.author),
                        e('div', { className: "flex flex-wrap items-center gap-2 mt-2 text-xs text-[#3E332E]/60" },
                          e('span', { className: "bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium" }, book.country),
                          e('span', { className: "bg-[#FDFBF7] px-2.5 py-0.5 rounded border border-[#3E332E]/15 font-medium" }, book.timePeriod),
                          book.archiveMode === 'keep' && book.eloRank !== null && e('span', { className: "text-[#7A8D7B] font-medium" }, "Stats Kept (Elo: " + book.eloRank + ")")
                        )
                      ),
                      e('button', {
                        onClick: () => handleUnarchive(book.id),
                        className: "bg-[#1A110E] text-[#FDFBF7] px-4 py-2 rounded text-xs tracking-wider uppercase hover:bg-[#7A8D7B] transition-colors flex items-center gap-1.5 cursor-pointer"
                      },
                        getIcon('rotate-ccw', { className: "w-3.5 h-3.5" }),
                        e('span', null, book.archiveMode === 'keep' && book.eloRank !== null ? 'Unarchive & Rerank' : 'Unarchive')
                      )
                    )
                  )
                )
              )
            ),

            // Footer
            e('footer', { className: "border-t border-[#3E332E]/15 bg-[#F5F2EB]/50 py-6 text-center text-xs text-[#3E332E]/60 font-serif" },
              e('p', null, "Marginalia — Synchronised with your Google Sheets Corpus.")
            )
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(e(MarginaliaApp));
    </script>
</body>
</html>
