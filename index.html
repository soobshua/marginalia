<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marginalia — The 500</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons UMD -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap');
      body {
        font-family: 'Newsreader', serif;
        background-color: #FDFBF7;
        color: #3E332E;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
</head>
<body class="bg-[#FDFBF7] text-[#3E332E] selection:bg-[#B89388]/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const Icon = ({ name, className = "w-4 h-4", ...props }) => {
          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          }, [name]);
          return <i data-lucide={name} className={className} {...props}></i>;
        };

        function MarginaliaApp() {
          const [activeTab, setActiveTab] = useState('stack');
          const [books, setBooks] = useState([]);
          const [isLoading, setIsLoading] = useState(true);

          const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/10LcHUiSL2_GG_OyT18wyeFkJo3dzn0wU9o4QMq1Zdbw/export?format=csv";

          const [duelPair, setDuelPair] = useState([]);
          
          // Dispatch state
          const [dispatchBook, setDispatchBook] = useState('');
          const [dispatchRecipient, setDispatchRecipient] = useState('');
          const [dispatchMessage, setDispatchMessage] = useState('');

          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          });

          // Fetch and parse Google Sheet CSV
          useEffect(() => {
            fetch(SHEET_CSV_URL)
              .then(res => res.text())
              .then(csvText => {
                const rows = csvText.split('\n').map(row => row.split(',').map(val => val.replace(/^"|"$/g, '').trim()));
                const headers = rows[0].map(h => h.toLowerCase());
                
                const parsedBooks = rows.slice(1).filter(row => row.length >= headers.length && row[0]).map((row, idx) => {
                  const getCol = (name) => {
                    const i = headers.indexOf(name);
                    return i !== -1 ? row[i] : '';
                  };
                  const yr = parseInt(getCol('year')) || 1900;
                  const decadeStr = `${Math.floor(yr / 10) * 10}s`;

                  return {
                    id: `sheet-${idx}`,
                    title: getCol('title') || 'Untitled Text',
                    author: getCol('author') || 'Unknown Author',
                    era: getCol('era') || 'Foundational',
                    country: getCol('country') || 'Global',
                    year: yr,
                    decade: decadeStr,
                    eloRank: null,
                    readCount: 0,
                    rereadDates: [],
                    description: getCol('description') || 'Foundational text item.'
                  };
                });

                setBooks(parsedBooks);
                if (parsedBooks.length > 0) setDispatchBook(parsedBooks[0].title);
                setIsLoading(false);
              })
              .catch(err => {
                console.error("Error loading sheet:", err);
                setIsLoading(false);
              });
          }, []);

          const rankedBooks = books.filter(b => b.eloRank !== null).sort((a, b) => b.eloRank - a.eloRank);
          const unrankedBooks = books.filter(b => b.eloRank === null);

          useEffect(() => {
            if (rankedBooks.length >= 2 && duelPair.length === 0) {
              triggerRandomDuel(rankedBooks);
            }
          }, [books]);

          const triggerRandomDuel = (currentRanked = rankedBooks) => {
            if (currentRanked.length < 2) {
              setDuelPair([]);
              return;
            }
            const shuffled = [...currentRanked].sort(() => 0.5 - Math.random());
            setDuelPair([shuffled[0], shuffled[1]]);
          };

          const handleFirstRead = (id) => {
            setBooks(prev => {
              const updated = prev.map(b => {
                if (b.id === id) {
                  return { ...b, eloRank: 1500, readCount: 1 };
                }
                return b;
              });
              
              const newRanked = updated.filter(b => b.eloRank !== null);
              if (newRanked.length >= 2 && duelPair.length === 0) {
                const shuffled = [...newRanked].sort(() => 0.5 - Math.random());
                setDuelPair([shuffled[0], shuffled[1]]);
              }
              return updated;
            });
          };

          const handleReread = (id) => {
            const today = new Date().toISOString().split('T')[0];
            setBooks(prev => prev.map(b => {
              if (b.id === id) {
                return { ...b, readCount: b.readCount + 1, rereadDates: [...b.rereadDates, today] };
              }
              return b;
            }));

            const targetBook = books.find(b => b.id === id);
            if (targetBook && targetBook.eloRank !== null) {
              const peers = rankedBooks.filter(b => b.id !== id);
              if (peers.length > 0) {
                const randomPeer = peers[Math.floor(Math.random() * peers.length)];
                setDuelPair([targetBook, randomPeer]);
                setActiveTab('duel');
              }
            }
          };

          const handleDuelChoice = (winner, loser) => {
            const K = 32;
            const expectedWinner = 1 / (1 + Math.pow(10, (loser.eloRank - winner.eloRank) / 400));
            const expectedLoser = 1 / (1 + Math.pow(10, (winner.eloRank - loser.eloRank) / 400));

            const newWinnerRank = Math.round(winner.eloRank + K * (1 - expectedWinner));
            const newLoserRank = Math.round(loser.eloRank + K * (0 - expectedLoser));

            setBooks(prev => prev.map(b => {
              if (b.id === winner.id) return { ...b, eloRank: newWinnerRank };
              if (b.id === loser.id) return { ...b, eloRank: newLoserRank };
              return b;
            }));

            setTimeout(() => {
              const currentRanked = books.map(b => {
                if (b.id === winner.id) return { ...b, eloRank: newWinnerRank };
                if (b.id === loser.id) return { ...b, eloRank: newLoserRank };
                return b;
              }).filter(b => b.eloRank !== null);
              
              if (currentRanked.length >= 2) {
                const shuffled = [...currentRanked].sort(() => 0.5 - Math.random());
                setDuelPair([shuffled[0], shuffled[1]]);
              } else {
                setDuelPair([]);
              }
            }, 100);
          };

          const exportJournal = () => {
            let content = `# Marginalia Sanctuary Journal\n\n`;
            content += `## Ranked Stack (${rankedBooks.length} Texts)\n`;
            rankedBooks.forEach((b, i) => {
              content += `${i + 1}. **${b.title}** by ${b.author} (${b.decade}, ${b.country}) - Elo: ${b.eloRank}\n`;
            });

            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'marginalia_sanctuary.md';
            link.click();
          };

          const handleDispatchMail = (e) => {
            e.preventDefault();
            const subject = encodeURIComponent(`A Foundational Text Dispatch: ${dispatchBook}`);
            const body = encodeURIComponent(`Hello,\n\nI am sharing a foundational text with you from The 500 corpus:\n\nTitle: ${dispatchBook}\n\nNote:\n${dispatchMessage}\n\n— Sent via Marginalia`);
            window.location.href = `mailto:${dispatchRecipient}?subject=${subject}&body=${body}`;
          };

          const getFavoriteMetric = (key) => {
            if (rankedBooks.length === 0) return 'None yet';
            const counts = {};
            rankedBooks.forEach(b => {
              let val = b[key];
              if (val) counts[val] = (counts[val] || 0) + 1;
            });
            let topVal = 'None';
            let maxCount = 0;
            for (const [k, v] of Object.entries(counts)) {
              if (v > maxCount) {
                maxCount = v;
                topVal = k;
              }
            }
            return topVal;
          };

          const favoriteCountry = getFavoriteMetric('country');
          const favoriteAuthor = getFavoriteMetric('author');
          const favoriteDecade = getFavoriteMetric('decade');

          if (isLoading) {
            return (
              <div className="min-h-screen flex items-center justify-center bg-[#FDFBF7]">
                <p className="font-serif italic text-lg text-[#3E332E]">Loading Marginalia Corpus...</p>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-[#FDFBF7] text-[#3E332E] font-serif flex flex-col">
              <header className="border-b border-[#3E332E]/15 bg-[#F5F2EB]/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <Icon name="feather" className="w-6 h-6 text-[#7A8D7B]" />
                  <h1 className="text-2xl font-semibold tracking-wide text-[#1A110E] font-serif">Marginalia</h1>
                </div>

                <nav className="hidden md:flex items-center gap-1 bg-[#FDFBF7] border border-[#3E332E]/10 p-1 rounded-lg shadow-inner">
                  {[
                    { id: 'stack', label: 'Ranking Stack', icon: 'book-open' },
                    { id: 'duel', label: 'Duels', icon: 'flame' },
                    { id: 'profile', label: 'Reader Profile', icon: 'compass' },
                    { id: 'dispatch', label: 'Dispatch Letter', icon: 'send' },
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center gap-2 px-3.5 py-1.5 rounded-md text-sm transition-all ${
                        activeTab === tab.id ? 'bg-[#1A110E] text-[#FDFBF7] shadow-sm' : 'text-[#3E332E]/70 hover:text-[#1A110E] hover:bg-[#F5F2EB]'
                      }`}
                    >
                      <Icon name={tab.icon} className="w-4 h-4" />
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </nav>

                <button
                  onClick={exportJournal}
                  className="text-xs border border-[#3E332E]/30 px-3 py-1.5 rounded hover:bg-[#3E332E] hover:text-[#FDFBF7] transition-all flex items-center gap-1.5 shadow-sm"
                >
                  <Icon name="file-text" className="w-3.5 h-3.5" />
                  <span>Export Journal</span>
                </button>
              </header>

              <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
                {activeTab === 'stack' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div>
                      <h2 className="text-3xl font-serif text-[#1A110E]">The 500</h2>
                      <p className="text-sm text-[#3E332E]/70 italic mt-1">Master relative ranking stack based on your logged reads.</p>
                    </div>

                    {rankedBooks.length > 0 && (
                      <div className="space-y-4">
                        <h3 className="text-xl font-serif text-[#1A110E] border-b border-[#3E332E]/10 pb-2">Ranked Texts</h3>
                        <div className="grid gap-4">
                          {rankedBooks.map((book, index) => (
                            <div
                              key={book.id}
                              className="bg-[#F5F2EB]/50 border border-[#3E332E]/15 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs"
                            >
                              <div className="flex items-center gap-4">
                                <span className="font-serif text-lg text-[#3E332E]/40 w-6 text-right">#{index + 1}</span>
                                <div>
                                  <h4 className="font-serif text-lg text-[#1A110E] font-medium">{book.title}</h4>
                                  <p className="text-sm text-[#3E332E]/80">by {book.author}</p>
                                  <div className="flex flex-wrap items-center gap-2 mt-1 text-xs text-[#3E332E]/60">
                                    <span className="bg-[#FDFBF7] px-2 py-0.5 rounded border border-[#3E332E]/10">{book.decade}</span>
                                    <span className="bg-[#FDFBF7] px-2 py-0.5 rounded border border-[#3E332E]/10">{book.country}</span>
                                    {book.readCount > 1 && (
                                      <span className="text-[#B89388] font-medium flex items-center gap-1">
                                        <Icon name="rotate-ccw" className="w-3 h-3" /> Reread {book.readCount - 1}x
                                      </span>
                                    )}
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-[#3E332E]/10">
                                <div className="text-right">
                                  <span className="text-xs uppercase tracking-wider text-[#3E332E]/50 block">Elo Score</span>
                                  <span className="font-mono text-sm font-semibold text-[#1A110E]">{book.eloRank}</span>
                                </div>
                                <button
                                  onClick={() => handleReread(book.id)}
                                  className="border border-[#3E332E]/30 px-3 py-1.5 rounded text-xs hover:bg-[#7A8D7B] hover:text-white transition-all flex items-center gap-1.5"
                                >
                                  <Icon name="rotate-ccw" className="w-3 h-3" />
                                  <span>Log Reread</span>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {unrankedBooks.length > 0 && (
                      <div className="space-y-4 pt-4">
                        <h3 className="text-xl font-serif text-[#1A110E] border-b border-[#3E332E]/10 pb-2">Unread / Unranked Corpus</h3>
                        <div className="grid gap-4">
                          {unrankedBooks.map((book) => (
                            <div
                              key={book.id}
                              className="bg-[#F5F2EB]/30 border border-[#3E332E]/10 rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"
                            >
                              <div>
                                <h4 className="font-serif text-lg text-[#1A110E] font-medium">{book.title}</h4>
                                <p className="text-sm text-[#3E332E]/80">by {book.author}</p>
                                <div className="flex flex-wrap items-center gap-2 mt-1 text-xs text-[#3E332E]/60">
                                  <span className="bg-[#FDFBF7] px-2 py-0.5 rounded border border-[#3E332E]/10">{book.decade}</span>
                                  <span className="bg-[#FDFBF7] px-2 py-0.5 rounded border border-[#3E332E]/10">{book.country}</span>
                                </div>
                              </div>

                              <button
                                onClick={() => handleFirstRead(book.id)}
                                className="bg-[#1A110E] text-[#FDFBF7] px-4 py-2 rounded text-xs tracking-wider uppercase hover:bg-[#7A8D7B] transition-colors"
                              >
                                Log Read
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'duel' && (
                  <div className="max-w-3xl mx-auto space-y-8 animate-fadeIn text-center">
                    <div>
                      <h2 className="text-3xl font-serif text-[#1A110E]">Corpus Duels</h2>
                      <p className="text-sm text-[#3E332E]/70 italic mt-1">Calibrate your relative ranking stack between foundational texts.</p>
                    </div>

                    {duelPair.length === 2 ? (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 my-8">
                        {duelPair.map((book, idx) => (
                          <div
                            key={book.id}
                            onClick={() => handleDuelChoice(book, duelPair[1 - idx])}
                            className="bg-[#F5F2EB] border-2 border-[#3E332E]/20 hover:border-[#7A8D7B] rounded-xl p-6 cursor-pointer transition-all shadow-md flex flex-col items-center group"
                          >
                            <h3 className="font-serif text-xl text-[#1A110E] font-medium mb-2">{book.title}</h3>
                            <p className="text-sm text-[#3E332E]/70 mb-3">by {book.author}</p>
                            <p className="text-xs text-[#3E332E]/60 italic line-clamp-2 mb-4 bg-[#FDFBF7] p-2 rounded border border-[#3E332E]/10">"{book.description}"</p>
                            <button className="mt-auto bg-[#1A110E] text-[#FDFBF7] px-4 py-2 rounded text-xs tracking-wider uppercase group-hover:bg-[#7A8D7B] transition-colors">
                              Prefer This Text
                            </button>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 rounded-xl p-8 my-12">
                        <p className="font-serif italic text-lg text-[#3E332E]/80">Log at least two reads in the stack to begin dueling.</p>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'profile' && (
                  <div className="space-y-8 animate-fadeIn">
                    <div className="border-b border-[#3E332E]/15 pb-4">
                      <h2 className="text-3xl font-serif text-[#1A110E]">Reader Profile</h2>
                      <p className="text-sm text-[#3E332E]/70 italic">Insights derived exclusively from your ranked corpus.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2">Favorite Country</span>
                        <span className="text-2xl font-serif text-[#1A110E]">{favoriteCountry}</span>
                      </div>
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2">Favorite Author</span>
                        <span className="text-2xl font-serif text-[#1A110E]">{favoriteAuthor}</span>
                      </div>
                      <div className="bg-[#F5F2EB] border border-[#3E332E]/15 p-6 rounded-lg text-center">
                        <span className="text-xs uppercase tracking-wider text-[#3E332E]/60 block mb-2">Favorite Time Period</span>
                        <span className="text-2xl font-serif text-[#1A110E]">{favoriteDecade}</span>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'dispatch' && (
                  <div className="max-w-xl mx-auto space-y-8 animate-fadeIn">
                    <div className="border-b border-[#3E332E]/15 pb-4">
                      <h2 className="text-3xl font-serif text-[#1A110E]">Dispatch a Letter</h2>
                      <p className="text-sm text-[#3E332E]/70 italic">Send a book and custom note directly via your email client.</p>
                    </div>

                    <form onSubmit={handleDispatchMail} className="bg-[#F5F2EB] border border-[#3E332E]/15 rounded-lg p-6 space-y-4 shadow-sm">
                      <div>
                        <label className="block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1">Select Book</label>
                        <select
                          value={dispatchBook}
                          onChange={(e) => setDispatchBook(e.target.value)}
                          className="w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]"
                        >
                          {books.map(b => (
                            <option key={b.id} value={b.title}>{b.title} by {b.author}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1">Recipient Email Address</label>
                        <input
                          type="email"
                          required
                          placeholder="colleague@example.com"
                          value={dispatchRecipient}
                          onChange={(e) => setDispatchRecipient(e.target.value)}
                          className="w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]"
                        />
                      </div>

                      <div>
                        <label className="block text-xs uppercase tracking-wider text-[#3E332E]/70 mb-1">Personalized Message / Notes</label>
                        <textarea
                          rows="4"
                          required
                          placeholder="Write your reflections or thoughts on this text..."
                          value={dispatchMessage}
                          onChange={(e) => setDispatchMessage(e.target.value)}
                          className="w-full bg-[#FDFBF7] border border-[#3E332E]/20 rounded p-2 text-sm text-[#1A110E]"
                        ></textarea>
                      </div>

                      <button
                        type="submit"
                        className="w-full bg-[#1A110E] text-[#FDFBF7] py-2.5 rounded text-xs tracking-wider uppercase hover:bg-[#7A8D7B] transition-colors flex items-center justify-center gap-2"
                      >
                        <Icon name="send" className="w-4 h-4" />
                        <span>Open Mail Client to Dispatch</span>
                      </button>
                    </form>
                  </div>
                )}
              </main>

              <footer className="border-t border-[#3E332E]/15 bg-[#F5F2EB]/50 py-6 text-center text-xs text-[#3E332E]/60 font-serif">
                <p>Marginalia — Synchronized with your Google Sheets Corpus.</p>
              </footer>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MarginaliaApp />);
    </script>
</body>
</html>
